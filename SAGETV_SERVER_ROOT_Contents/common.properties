# Shared safe defaults for XMLTV profiles.
# A selected xmltv_*.profile overrides these values. The selecting
# .xmltv.properties file always has final priority.

xmltv.validate_before_import=true
xmltv.parser.max_element_chars=4194304
xmltv.download.connect_timeout_ms=10000
xmltv.download.read_timeout_ms=30000
xmltv.download.max_bytes=268435456
xmltv.download.max_redirects=5
run.before.timeout_ms=300000
run.before.fail_on_error=true
run.before.log_command=false

sagetv.channel.IconDownload=false
sagetv.channel.IconMaxWidth=256
sagetv.channel.IconMaxHeight=256
sagetv.channel.NumberSeparator=.
sagetv.channel.NumberOffset=0
sagetv.show.Icon=false

xmltv.show_id.strategy=legacy
xmltv.show_id.display=none
title.add.year=false
episode.name.add.episode.number=false
episode.name.add.part.number=false

log.defaults=true
log.configuration=true
log.channel=true
log.show=true
